<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teams Meeting Assistant</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <h1>Teams 会议助手</h1>
      <span id="statusBadge" class="badge idle">空闲</span>
    </header>

    <p id="teamsTab" class="teamsTab">自动选择正在播放声音的 Teams 标签页</p>

    <section class="buttons">
      <button id="start" class="primary">开始会议转写</button>
      <button id="stop" class="danger" disabled>结束并生成会议纪要</button>
    </section>

    <section class="settings">
      <h2>混音设置</h2>

      <label for="tabGain">Teams 页面声音 <span id="tabGainValue">3.0x</span></label>
      <input id="tabGain" type="range" min="0" max="5" step="0.1" value="3">

      <label for="micGain">麦克风声音 <span id="micGainValue">1.0x</span></label>
      <input id="micGain" type="range" min="0" max="3" step="0.1" value="1">

      <label for="speechThreshold">背景音过滤阈值 <span id="thresholdValue">0.006</span></label>
      <input id="speechThreshold" type="range" min="0.001" max="0.030" step="0.001" value="0.006">

      <label for="silenceDuration">自动分段静音 <span id="silenceValue">2.0秒</span></label>
      <input id="silenceDuration" type="range" min="1000" max="5000" step="250" value="2000">
      <div class="checkboxRow">
        <input id="autoMicSync" type="checkbox">
        <label for="autoMicSync">自动同步 Teams 麦克风状态（会议中时）</label>
      </div>
    </section>

    <div class="meterRow">
      <span>混音音量</span>
      <progress id="audioLevel" max="0.1" value="0"></progress>
    </div>

    <section>
      <div class="sectionHeader">
        <h2>会议转写</h2>
        <span id="language"></span>
      </div>
      <textarea id="transcript" readonly placeholder="会议文字将在这里显示"></textarea>
    </section>

    <section class="summarySection">
      <h2>200字以内会议纪要</h2>
      <textarea id="summary" readonly placeholder="结束转写后自动生成"></textarea>
    </section>

    <div class="footerButtons">
      <button id="copyTranscript">复制转写</button>
      <button id="copySummary">复制纪要</button>
      <button id="clear">清空</button>
    </div>

    <p class="notice">建议佩戴耳机，避免扬声器声音再次被麦克风收录。请确保参会者知情并符合公司政策。</p>
    <p id="error" class="error" hidden></p>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
